<!DOCTYPE html>
<html lang="he" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aion 2 Pets Tracker Overlay</title>
  <style>
    :root {
      --bg-shell: rgba(13, 16, 23, 0.94);
      --bg-card: rgba(20, 26, 38, 0.90);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #070a12;
      color: var(--text);
      padding: 12px;
    }

    .tracker-window {
      max-width: 460px;
      margin: 0 auto;
      background: var(--bg-shell);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lv-badge {
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: none;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }

    .options-panel {
      background: rgba(20, 26, 38, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 8px;
      padding: 7px 9px;
      margin-bottom: 7px;
    }

    .cb-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 11.5px;
    }

    .cb-grid label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .sub-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 3px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.22);
      color: var(--accent);
      border-color: var(--accent);
    }

    .minimap-box {
      position: relative;
      height: 165px;
      background: rgba(9, 13, 22, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      margin-bottom: 7px;
      overflow: hidden;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: calc(100vh - 230px);
      overflow-y: auto;
    }

    .pet-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 7px;
      min-height: 46px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 9px;
      gap: 8px;
    }

    .fill-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background: rgba(30, 88, 148, 0.42);
      border-right: 2px solid var(--accent);
      pointer-events: none;
      z-index: 0;
    }

    .fill-bar.lv3 {
      background: rgba(16, 185, 129, 0.28);
      border-right-color: var(--green);
    }

    .card-left {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .pet-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #0a0e16;
      border: 1px solid rgba(255, 255, 255, 0.18);
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-info {
      min-width: 0;
      flex: 1;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      margin-top: 2px;
    }

    .diamonds {
      letter-spacing: 1px;
      font-size: 11px;
    }

    .card-right {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="tracker-window">
    <div class="header">
      <div class="header-title" id="headerTitle">Tracker · ...</div>
      <div class="header-actions">
        <span class="lv-badge">Lv. 3 ▾</span>
        <button class="icon-btn" onclick="toggleOptions()">⚙</button>
        <button class="icon-btn" id="langBtn" onclick="toggleLang()">HEB</button>
      </div>
    </div>

    <div class="options-panel" id="optionsPanel">
      <div class="cb-grid">
        <label><input type="checkbox" id="cbIcons" checked onchange="renderAll()" /> <span id="lblCbIcons">🖼 תמונות</span></label>
        <label><input type="checkbox" id="cbDist" checked onchange="renderAll()" /> <span id="lblCbDist">🧭 מרחק (m)</span></label>
        <label><input type="checkbox" id="cbMap" onchange="renderAll()" /> <span id="lblCbMap">🗺 מפה חיה</span></label>
        <label><input type="checkbox" id="cbPin" checked onchange="renderAll()" /> <span id="lblCbPin">📍 כמות סביבי</span></label>
        <label><input type="checkbox" id="cbDiamonds" checked onchange="renderAll()" /> <span id="lblCbDiamonds">💎 שלב (◆◆◆)</span></label>
        <label><input type="checkbox" id="cbRem3" checked onchange="renderAll()" /> <span id="lblCbRem3">🎯 חסר ל-3</span></label>
        <label><input type="checkbox" id="cbHide3" onchange="renderAll()" /> <span id="lblCbHide3">👁 הסתר שלב 3</span></label>
      </div>
    </div>

    <div class="sub-bar">
      <div>
        <span id="sumAccent" style="color:var(--accent);font-weight:700">Get missing pets: </span>
        <span id="sumRest" style="color:#cbd5e1">...</span>
      </div>
      <div class="tabs">
        <button class="tab-btn" data-tab="around" id="tAround" onclick="setTab('around')">🟢</button>
        <button class="tab-btn active" data-tab="area" id="tArea" onclick="setTab('area')">📍</button>
        <button class="tab-btn" data-tab="map" id="tMap" onclick="setTab('map')">🗺</button>
        <button class="tab-btn" data-tab="all" id="tAll" onclick="setTab('all')">All</button>
      </div>
    </div>

    <div class="minimap-box" id="miniMapBox" style="display:none">
      <canvas id="miniMapCanvas" width="438" height="165"></canvas>
    </div>

    <div class="cards-list" id="cardsList"></div>
  </div>

  <script>
    let latestState = null;
    let currentTab = "area";
    let lang = localStorage.getItem("a2_overlay_lang") || "HEB";

    function tr(h, e, r) { return lang === "ENG" ? e : (lang === "RUS" ? r : h); }

    function toggleOptions() {
      const el = document.getElementById("optionsPanel");
      el.style.display = el.style.display === "none" ? "block" : "none";
    }

    function toggleLang() {
      lang = lang === "HEB" ? "ENG" : (lang === "ENG" ? "RUS" : "HEB");
      localStorage.setItem("a2_overlay_lang", lang);
      document.getElementById("htmlRoot").dir = lang === "HEB" ? "rtl" : "ltr";
      document.getElementById("langBtn").textContent = lang;
      renderAll();
    }

    function setTab(t) {
      currentTab = t;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
      renderAll();
    }

    function renderAll() {
      if (!latestState) return;
      const showIcons = document.getElementById("cbIcons").checked;
      const showDist = document.getElementById("cbDist").checked;
      const showMap = document.getElementById("cbMap").checked;
      const showPin = document.getElementById("cbPin").checked;
      const showDiamonds = document.getElementById("cbDiamonds").checked;
      const showRem3 = document.getElementById("cbRem3").checked;
      const hide3 = document.getElementById("cbHide3").checked;

      document.getElementById("miniMapBox").style.display = showMap ? "block" : "none";

      const areaName = latestState.location?.areaName || latestState.location?.mapName || "Altgard";
      document.getElementById("headerTitle").textContent = tr("מעקב · ", "Tracker · ", "Трекер · ") + areaName;

      const curArea = latestState.location?.areaName;
      const filtered = (latestState.pets || []).filter(p => {
        const inArea = p.spawnsInCurrentArea > 0 || (curArea && (p.currentMapAreas || []).includes(curArea));
        if (currentTab === "around" && p.aroundCount <= 0) return false;
        if (currentTab === "area" && p.aroundCount <= 0 && !inArea) return false;
        if (currentTab === "map" && p.spawnsInCurrentMap <= 0 && p.aroundCount <= 0) return false;
        if (hide3 && p.isLevel3) return false;
        return true;
      });

      const missingHere = filtered.filter(p => !p.isLevel3);
      const soulsHere = missingHere.reduce((a, p) => a + p.remainingToLevel3, 0);

      document.getElementById("sumAccent").textContent = tr("חיות להשלמה: ", "Get missing pets: ", "Питомцы: ");
      document.getElementById("sumRest").textContent =
        `${missingHere.length} ${tr("כאן", "here", "здесь")} · ${soulsHere} ${tr("נשמות חסרות", "souls left", "душ осталось")}`;

      const listEl = document.getElementById("cardsList");
      listEl.innerHTML = filtered.slice(0, 40).map(p => {
        const pct = Math.round((p.stepFillRatio || 0) * 100);
        const mobName = p.primaryMonsterName || p.name;
        const title = mobName !== p.name ? `${mobName} (${p.name})` : mobName;

        let dHtml = "";
        if (showDiamonds) {
          for (let i = 1; i <= 3; i++) {
            const c = p.level >= i ? (p.isLevel3 ? "#34d399" : "#38bdf8") : "#1e293b";
            dHtml += `<span style="color:${c}">◆</span>`;
          }
          dHtml += ` <span style="color:#cbd5e1;font-weight:600">${p.isLevel3 ? "MAX" : `${p.soulsInStep}/${p.nextStepNeed}`}</span>`;
        }

        const remHtml = showRem3
          ? `<span style="color:${p.isLevel3 ? '#34d399' : '#fbbf24'};font-weight:700">${
              p.isLevel3 ? tr("נשאר: 0 ✔", "Left: 0 ✔", "Осталось: 0 ✔") : `${tr("חסר ל-3:", "To Lv.3:", "До Ур.3:")} ${p.remainingToLevel3}`
            }</span>`
          : "";

        const pinCnt = p.aroundCount > 0 ? `🟢 ${p.aroundCount}` : (p.spawnsInCurrentArea || p.spawnsInCurrentMap);
        const pinHtml = showPin
          ? `<div style="font-size:11.5px;color:${p.aroundCount > 0 ? '#34d399' : '#94a3b8'};font-weight:700">${pinCnt} 📍</div>`
          : "";

        const distHtml = (showDist && p.nearestDistanceM !== null && p.nearestDistanceM !== undefined)
          ? `<div style="font-size:12px;font-weight:700;color:${p.isLiveDistance ? '#6ee7b7' : '#fff'}">${p.directionArrow || '←'} ${p.nearestDistanceM} m</div>`
          : "";

        return `
          <div class="pet-card">
            <div class="fill-bar ${p.isLevel3 ? 'lv3' : ''}" style="width:${pct}%"></div>
            <div class="card-left">
              ${showIcons ? `<img class="pet-icon" src="${p.icon}" alt="" />` : ""}
              <div class="card-info">
                <div class="card-title">${title}</div>
                <div class="card-meta">
                  <span class="diamonds">${dHtml}</span>
                  ${remHtml}
                </div>
              </div>
            </div>
            <div class="card-right">
              ${pinHtml}
              ${distHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    function connect() {
      fetch("/api/state").then(r => r.json()).then(s => { latestState = s; renderAll(); }).catch(() => {});
      const es = new EventSource("/events");
      es.onmessage = e => { try { latestState = JSON.parse(e.data); renderAll(); } catch {} };
    }
    connect();
  </script>
</body>
</html>
